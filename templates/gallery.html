<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery · ECE Workshops</title>
  <meta name="description"
    content="Photos from the 2026 UofT ECE Workshops." />

  <!-- set the saved theme before paint so there's no flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) { }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=16" />
</head>

<body class="mono">

  <!-- ===== nav ===== -->
  <nav class="nav" data-resize-id="box.nav">
    <div class="wrap nav-inner">
      <a href="index.html" class="brand" data-resize-id="box.brand"><img src="assets/logo.png" class="brand-logo"
          data-resize-id="img.brand.nav" alt="ECE Workshops" /> <span data-edit-id="nav.brand">ECE Workshops</span></a>
      <div class="nav-links">
        <a href="index.html#about" data-edit-id="gallery.nav.link.about">About</a>
        <a href="index.html#schedule" data-edit-id="gallery.nav.link.schedule">Schedule</a>
        <a href="index.html#prizes" data-edit-id="gallery.nav.link.prizes">Prizes</a>
      </div>
      <div class="nav-right">
        <button id="themeBtn" class="theme-btn" type="button" aria-label="Toggle theme" data-resize-id="box.themeBtn" data-theme-toggle="1">
          <span class="tic-icon" data-resize-id="box.themeBtn.icon">
            <svg class="tic sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <svg class="tic moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
          </span>
          <span class="tic-label" data-edit-id="nav.themeBtn.label"></span>
        </button>
        <a class="nav-back" href="index.html" data-edit-id="gallery.nav.home">Home</a>
      </div>
    </div>
  </nav>

  <!-- ===== gallery viewer =====
       Nothing in here is the viewer itself anymore: the directory rail, the
       photo stage, its two arrows and its counter are five placed custom
       elements (app/db.py's _GALLERY_ENTRIES, built by js/main.js's
       buildCustomElement()), so a ta can move, resize, restyle, delete and
       re-add every one of them from the visual editor's Gallery tab - the
       same treatment the student dashboard's tile areas already got. What's
       left below is reserved space: in-flow spacers those elements anchor to
       (see applyElementAnchors() in js/main.js), so the page still lays
       itself out normally even though the real content is out of flow. -->
  <section class="section-sm">
    <div class="wrap">
      <p class="eyebrow" data-edit-id="gallery.eyebrow">Photos and clips</p>
      <h1 style="font-size:1.9rem;margin-bottom:24px" data-edit-id="gallery.heading">Gallery</h1>

      <div class="gv">
        <!-- the directory rail's live area. js/gallery.js's renderDirs() finds
             the placed element by its data-gallery-dirs-area marker and
             renders one tile per directory into it. -->
        <div class="gv-dirs-anchor" id="galleryDirsAnchor" aria-hidden="true"></div>

        <!-- the photo stage, plus the three things that sit ON it: both
             arrows and the counter anchor to their own spacers inside this
             one, so they start out over the photo the way they always have -->
        <div class="gv-stage-anchor" id="galleryPaneAnchor" aria-hidden="true">
          <div class="gv-prev-anchor" id="galleryPrevAnchor"></div>
          <div class="gv-next-anchor" id="galleryNextAnchor"></div>
          <div class="gv-count-anchor" id="galleryCountAnchor"></div>
        </div>
      </div>

      <p class="gv-hint muted" data-edit-id="gallery.hint">Click the photo or use the arrow keys to flip through.</p>
    </div>
  </section>

  <!-- ===== footer ===== -->
  <footer class="footer" data-resize-id="box.footer">
    <div class="wrap foot-grid">
      <div>
        <div class="brand" style="margin-bottom:6px"><img src="assets/logo.png" class="brand-logo"
            data-resize-id="img.brand.footer" alt="ECE Workshops" /> <span data-edit-id="nav.brand">ECE Workshops</span></div>
        <div data-edit-id="footer.org">University of Toronto ECE</div>
      </div>
      <div>
        <div data-edit-id="footer.contact">Questions? hardware.robotics@utoronto.ca</div>
      </div>
    </div>
  </footer>

  <script src="js/theme.js?v=3"></script>
  <script src="js/main.js?v=16"></script>
  <script src="js/gallery.js?v=5"></script>
</body>
</html>
